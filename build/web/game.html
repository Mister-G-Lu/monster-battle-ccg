<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Card Battle - Offline Prototype</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a1a2e; color: #eee; font-family: 'Segoe UI', sans-serif; overflow-x: hidden; }
.screen { display: none; width: 100%; min-height: 100vh; padding: 20px; }
.screen.active { display: flex; flex-direction: column; align-items: center; }

/* World Screen */
#world { justify-content: flex-start; padding-top: 40px; }
#world h1 { font-size: 2em; margin-bottom: 10px; color: #e94560; }
#world .stats { display: flex; gap: 20px; margin: 15px 0; font-size: 1.1em; }
#world .stats span { background: #16213e; padding: 8px 16px; border-radius: 8px; }
.stage-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; width: 100%; max-width: 800px; margin-top: 20px; }
.stage-card { background: #16213e; border: 2px solid #0f3460; border-radius: 10px; padding: 15px; cursor: pointer; transition: all 0.2s; }
.stage-card:hover { border-color: #e94560; transform: translateY(-2px); }
.stage-card h3 { color: #e94560; margin-bottom: 5px; }
.stage-card .diff { color: #aaa; font-size: 0.9em; }
.stage-card .reward { color: #53d769; font-size: 0.85em; margin-top: 5px; }

/* Battle Screen */
#battle { justify-content: space-between; padding: 10px; }
.battle-header { display: flex; justify-content: space-between; width: 100%; max-width: 700px; padding: 10px; background: #16213e; border-radius: 10px; }
.hp-bar { height: 20px; background: #333; border-radius: 10px; overflow: hidden; margin: 5px 0; }
.hp-fill { height: 100%; transition: width 0.3s; border-radius: 10px; }
.hp-fill.player { background: linear-gradient(90deg, #53d769, #3bce60); }
.hp-fill.enemy { background: linear-gradient(90deg, #e94560, #c23152); }

.field { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 700px; }
.field-row { display: flex; justify-content: center; gap: 8px; min-height: 80px; }
.field-label { text-align: center; color: #aaa; font-size: 0.85em; margin: 5px 0; }

.card { width: 80px; height: 100px; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 0.75em; cursor: pointer; transition: all 0.2s; position: relative; border: 2px solid #333; }
.card:hover { transform: scale(1.05); }
.card.hand { background: linear-gradient(135deg, #0f3460, #16213e); }
.card.field-card { background: linear-gradient(135deg, #1a472a, #2d5a3f); }
.card.enemy-field { background: linear-gradient(135deg, #5a1a1a, #7a2a2a); }
.card.hand:hover { border-color: #e94560; }
.card .card-name { font-weight: bold; font-size: 0.85em; margin-bottom: 2px; }
.card .card-hp { color: #53d769; }
.card .card-cost { position: absolute; top: 2px; right: 4px; background: #e94560; color: white; border-radius: 50%; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; font-size: 0.8em; font-weight: bold; }
.card.empty { border: 2px dashed #333; opacity: 0.3; cursor: default; }
.card.dead { opacity: 0.3; border-color: #e94560; text-decoration: line-through; }

.crystal-bar { display: flex; align-items: center; gap: 8px; justify-content: center; margin: 5px 0; }
.crystal { width: 22px; height: 22px; background: #e94560; border-radius: 50%; }
.crystal.empty { background: #333; }

.battle-log { width: 100%; max-width: 700px; max-height: 120px; overflow-y: auto; background: #0a0a1a; border-radius: 8px; padding: 8px; font-size: 0.8em; color: #aaa; }
.battle-log div { margin: 2px 0; }
.battle-log .damage { color: #e94560; }
.battle-log .heal { color: #53d769; }
.battle-log .info { color: #539cd5; }

.btn { background: #e94560; color: white; border: none; padding: 10px 24px; border-radius: 8px; font-size: 1em; cursor: pointer; margin: 5px; transition: all 0.2s; }
.btn:hover { background: #c23152; }
.btn:disabled { background: #333; cursor: default; }
.btn.end-turn { background: #0f3460; }
.btn.end-turn:hover { background: #1a5276; }

/* Result overlay */
.result-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
.result-overlay.active { display: flex; }
.result-overlay h1 { font-size: 3em; margin-bottom: 20px; }
.result-overlay .win { color: #53d769; }
.result-overlay .lose { color: #e94560; }
</style>
</head>
<body>

<!-- WORLD SCREEN -->
<div id="world" class="screen active">
  <h1>English Card Battle</h1>
  <p style="color:#aaa">Offline Single-Player Prototype</p>
  <div class="stats">
    <span>Crystals: <b id="w-crystal">10</b></span>
    <span>Exp: <b id="w-exp">0</b></span>
    <span>Wins: <b id="w-wins">0</b></span>
    <span>Cards: <b id="w-cards">16</b></span>
  </div>
  <h2 style="margin-top:20px;color:#539cd5">PvE Stages</h2>
  <div class="stage-grid" id="stage-grid"></div>
</div>

<!-- BATTLE SCREEN -->
<div id="battle" class="screen">
  <div class="battle-header">
    <div style="flex:1">
      <div style="font-weight:bold;color:#53d769">Player</div>
      <div class="hp-bar"><div class="hp-fill player" id="p-hp" style="width:100%"></div></div>
      <div id="p-hp-text" style="font-size:0.85em;text-align:center">30/30</div>
    </div>
    <div style="text-align:center;padding:0 15px">
      <div style="font-size:1.5em;color:#e94560">VS</div>
      <div id="round-display" style="color:#aaa;font-size:0.9em">Round 1</div>
    </div>
    <div style="flex:1">
      <div style="font-weight:bold;color:#e94560;text-align:right">Enemy</div>
      <div class="hp-bar"><div class="hp-fill enemy" id="e-hp" style="width:100%"></div></div>
      <div id="e-hp-text" style="font-size:0.85em;text-align:center">30/30</div>
    </div>
  </div>

  <div class="field">
    <div class="field-label">Enemy Field</div>
    <div class="field-row" id="enemy-field"></div>
    <div class="crystal-bar" id="enemy-crystals"></div>
    <div class="crystal-bar" id="player-crystals"></div>
    <div class="field-row" id="player-field"></div>
    <div class="field-label">Your Field</div>
  </div>

  <div class="field-row" id="player-hand" style="margin:10px 0"></div>

  <div class="battle-log" id="battle-log"></div>

  <div style="display:flex;gap:8px;margin-top:10px">
    <button class="btn end-turn" id="btn-end-turn" onclick="endTurn()">End Turn</button>
    <button class="btn" onclick="showScreen('world')" style="background:#333">Surrender</button>
  </div>
</div>

<!-- RESULT OVERLAY -->
<div class="result-overlay" id="result-overlay">
  <h1 id="result-text"></h1>
  <p id="result-detail" style="color:#aaa;margin-bottom:20px"></p>
  <button class="btn" onclick="closeResult()">Continue</button>
</div>

// Player state
let player = {
  hp: 30, maxHp: 30, crystal: 0, maxCrystal: 0,
  deck: [], hand: [], field: [null, null, null],
  exp: 0, wins: 0, totalCards: []
};

// Battle state
let battle = null;
let selectedHand = null;

// Card pool by kind (war=1, nature=2, chaos=3, fortune=4, balance=5)
const KIND_NAMES = {1:'War',2:'Nature',3:'Chaos',4:'Fortune',5:'Balance'};
const KIND_COLORS = {1:'#e94560',2:'#53d769',3:'#9b59b6',4:'#f39c12',5:'#3498db'};

function initPlayer() {
  // Give player 16 starter cards (mix of kinds)
  const allCards = Object.values(GAME_DATA.cards).filter(c => c.type === 'monster' && c.hp > 0);
  allCards.sort((a,b) => a.cost - b.cost);
  // Pick 16 cards: 4 low-cost, 4 mid, 4 mid-high, 4 high
  const low = allCards.filter(c => c.cost <= 2).slice(0, 4);
  const mid = allCards.filter(c => c.cost === 3).slice(0, 4);
  const mid2 = allCards.filter(c => c.cost === 4).slice(0, 4);
  const high = allCards.filter(c => c.cost >= 5).slice(0, 4);
  player.totalCards = [...low, ...mid, ...mid2, ...high].map(c => ({...c, uid: c.id}));
  player.deck = shuffle([...player.totalCards]);
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function makeCard(c) {
  return {...c, currentHp: c.hp, canAttack: false};
}

function startBattle(playId, difficulty) {
  const key = String(playId * 10 + difficulty);
  let enemyDeck;
  if (GAME_DATA.pve[key] && GAME_DATA.pve[key].monsters.length > 0) {
    enemyDeck = GAME_DATA.pve[key].monsters.map(id => GAME_DATA.cards[id]).filter(Boolean);
  }
  if (!enemyDeck || enemyDeck.length === 0) {
    // Generate enemy deck based on difficulty
    const allCards = Object.values(GAME_DATA.cards).filter(c => c.type === 'monster' && c.hp > 0);
    const count = 12 + difficulty * 2;
    const pool = allCards.filter(c => c.cost <= 2 + difficulty);
    enemyDeck = [];
    for (let i = 0; i < count; i++) {
      enemyDeck.push({...pool[Math.floor(Math.random() * pool.length)]});
    }
  }

  battle = {
    round: 1,
    playerHp: 30, playerMaxHp: 30,
    enemyHp: 30, enemyMaxHp: 30,
    playerCrystal: 0, playerMaxCrystal: 0,
    enemyCrystal: 0, enemyMaxCrystal: 0,
    playerField: [null, null, null],
    enemyField: [null, null, null],
    playerHand: [],
    enemyHand: [],
    enemyDeck: enemyDeck.map(c => ({...c})),
    playerDeck: shuffle([...player.totalCards]).map(c => ({...c})),
    phase: 'prep', // prep, battle, over
    log: [],
    isOver: false,
    winner: null
  };

  // Draw initial hands
  for (let i = 0; i < 4; i++) {
    drawCard('player');
    drawCard('enemy');
  }

  // Start first round
  startRound();
  showScreen('battle');
  renderBattle();
}

function drawCard(who) {
  const b = battle;
  const deck = who === 'player' ? b.playerDeck : b.enemyDeck;
  const hand = who === 'player' ? b.playerHand : b.enemyHand;
  if (hand.length >= 4 || deck.length === 0) return false;
  const card = deck.shift();
  if (card) {
    card.canAttack = false;
    hand.push(card);
    return true;
  }
  return false;
}

function startRound() {
  const b = battle;
  b.round++;
  b.playerMaxCrystal = Math.min(b.round, 10);
  b.playerCrystal = b.playerMaxCrystal;
  b.enemyMaxCrystal = Math.min(b.round, 10);
  b.enemyCrystal = b.enemyMaxCrystal;

  // Draw a card each
  drawCard('player');
  drawCard('enemy');

  // Mark existing field cards as can attack
  for (let i = 0; i < 3; i++) {
    if (b.playerField[i]) b.playerField[i].canAttack = true;
    if (b.enemyField[i]) b.enemyField[i].canAttack = true;
  }

  b.phase = 'prep';
  addLog(`--- Round ${b.round} ---`, 'info');
}

function renderBattle() {
  const b = battle;
  if (!b) return;

  // HP bars
  document.getElementById('p-hp').style.width = (b.playerHp / b.playerMaxHp * 100) + '%';
  document.getElementById('p-hp-text').textContent = `${b.playerHp}/${b.playerMaxHp}`;
  document.getElementById('e-hp').style.width = (b.enemyHp / b.enemyMaxHp * 100) + '%';
  document.getElementById('e-hp-text').textContent = `${b.enemyHp}/${b.enemyMaxHp}`;
  document.getElementById('round-display').textContent = `Round ${b.round}`;

  // Crystals
  renderCrystals('player-crystals', b.playerCrystal, b.playerMaxCrystal);
  renderCrystals('enemy-crystals', b.enemyCrystal, b.enemyMaxCrystal);

  // Fields
  renderField('player-field', b.playerField, 'player');
  renderField('enemy-field', b.enemyField, 'enemy');

  // Hand
  renderHand('player-hand', b.playerHand);

  document.getElementById('btn-end-turn').disabled = b.isOver;
}

function renderCrystals(id, current, max) {
  const el = document.getElementById(id);
  el.innerHTML = '';
  for (let i = 0; i < max; i++) {
    const c = document.createElement('div');
    c.className = 'crystal' + (i >= current ? ' empty' : '');
    el.appendChild(c);
  }
}

function renderField(id, field, who) {
  const el = document.getElementById(id);
  el.innerHTML = '';
  for (let i = 0; i < 3; i++) {
    const card = field[i];
    if (card) {
      el.appendChild(createCardEl(card, who === 'player' ? 'field-card' : 'enemy-field', who, i));
    } else {
      const empty = document.createElement('div');
      empty.className = 'card empty';
      empty.textContent = 'Empty';
      el.appendChild(empty);
    }
  }
}

function renderHand(id, hand) {
  const el = document.getElementById(id);
  el.innerHTML = '';
  hand.forEach((card, i) => {
    const canPlay = card.cost <= battle.playerCrystal && battle.playerField.some(s => s === null);
    const c = createCardEl(card, 'hand' + (canPlay ? '' : ''), 'hand', i);
    if (canPlay) {
      c.onclick = () => deployCard(i);
      c.style.cursor = 'pointer';
    } else {
      c.style.opacity = '0.5';
    }
    el.appendChild(c);
  });
}

function createCardEl(card, className, owner, index) {
  const el = document.createElement('div');
  el.className = 'card ' + className;
  if (card.currentHp <= 0) el.classList.add('dead');

  const kindColor = KIND_COLORS[card.kind] || '#888';
  el.style.borderColor = kindColor;

  el.innerHTML = `
    <div class="card-cost">${card.cost}</div>
    <div class="card-name" style="color:${kindColor}">${card.name.substring(0,4)}</div>
    <div class="card-hp">HP:${card.currentHp}/${card.hp}</div>
  `;

  // Click handlers for field cards
  if (owner === 'player' && className === 'field-card' && card.canAttack && card.currentHp > 0) {
    el.onclick = () => selectAttacker(index);
    el.style.cursor = 'crosshair';
    el.style.boxShadow = '0 0 8px ' + kindColor;
  }

  return el;
}

function deployCard(handIndex) {
  const b = battle;
  const card = b.playerHand[handIndex];
  if (!card || card.cost > b.playerCrystal) return;

  const slot = b.playerField.findIndex(s => s === null);
  if (slot === -1) return;

  b.playerCrystal -= card.cost;
  card.canAttack = false; // summoning sickness
  b.playerField[slot] = card;
  b.playerHand.splice(handIndex, 1);

  addLog(`Deployed ${card.name} (HP:${card.hp})`, 'info');
  renderBattle();
}

function selectAttacker(fieldIndex) {
  // For simplicity: attack the same-position enemy slot, or enemy face if empty
  const b = battle;
  const attacker = b.playerField[fieldIndex];
  if (!attacker || !attacker.canAttack || attacker.currentHp <= 0) return;

  const target = b.enemyField[fieldIndex];
  if (target && target.currentHp > 0) {
    // Monster vs monster
    target.currentHp -= attacker.currentHp;
    attacker.currentHp -= target.hp;
    addLog(`${attacker.name} attacks ${target.name}!`, 'damage');
    if (target.currentHp <= 0) {
      addLog(`${target.name} destroyed!`, 'damage');
      b.enemyField[fieldIndex] = null;
    }
    if (attacker.currentHp <= 0) {
      addLog(`${attacker.name} destroyed!`, 'damage');
      b.playerField[fieldIndex] = null;
    }
  } else {
    // Attack enemy face
    b.enemyHp -= attacker.currentHp;
    addLog(`${attacker.name} hits enemy for ${attacker.currentHp}!`, 'damage');
    attacker.canAttack = false;
  }

  if (b.enemyHp <= 0) endBattle(true);
  else renderBattle();
}

function endTurn() {
  const b = battle;
  if (b.isOver) return;

  // Player turn done
  addLog('--- Enemy Turn ---', 'info');

  // Enemy AI: deploy cheapest affordable cards
  for (let i = b.enemyHand.length - 1; i >= 0; i--) {
    const card = b.enemyHand[i];
    const slot = b.enemyField.findIndex(s => s === null);
    if (slot !== -1 && card.cost <= b.enemyCrystal) {
      b.enemyCrystal -= card.cost;
      card.canAttack = false;
      b.enemyField[slot] = card;
      b.enemyHand.splice(i, 1);
      addLog(`Enemy deploys ${card.name}`, 'info');
    }
  }

  // Enemy attacks
  for (let i = 0; i < 3; i++) {
    const attacker = b.enemyField[i];
    if (!attacker || !attacker.canAttack || attacker.currentHp <= 0) continue;

    const target = b.playerField[i];
    if (target && target.currentHp > 0) {
      target.currentHp -= attacker.currentHp;
      attacker.currentHp -= target.hp;
      addLog(`Enemy ${attacker.name} attacks ${target.name}!`, 'damage');
      if (target.currentHp <= 0) { b.playerField[i] = null; }
      if (attacker.currentHp <= 0) { b.enemyField[i] = null; }
    } else {
      b.playerHp -= attacker.currentHp;
      addLog(`Enemy ${attacker.name} hits you for ${attacker.currentHp}!`, 'damage');
      attacker.canAttack = false;
    }
  }

  if (b.playerHp <= 0) { endBattle(false); return; }

  // Check if both sides have no cards left (draw game after 20 rounds)
  const playerTotal = b.playerHand.length + b.playerField.filter(c=>c).length + b.playerDeck.length;
  const enemyTotal = b.enemyHand.length + b.enemyField.filter(c=>c).length + b.enemyDeck.length;
  if (playerTotal === 0 && enemyTotal === 0) {
    if (b.round > 20) { endBattle(b.playerHp >= b.enemyHp); return; }
  }

  // Next round
  startRound();
  renderBattle();
}

function endBattle(won) {
  battle.isOver = true;
  battle.winner = won ? 'player' : 'enemy';

  const overlay = document.getElementById('result-overlay');
  const text = document.getElementById('result-text');
  const detail = document.getElementById('result-detail');

  if (won) {
    player.wins++;
    const expGain = 10 + (battle.round);
    player.exp += expGain;
    text.innerHTML = '<span class="win">VICTORY!</span>';
    detail.textContent = `+${expGain} EXP | Rounds: ${battle.round}`;
  } else {
    text.innerHTML = '<span class="lose">DEFEAT</span>';
    detail.textContent = `Better luck next time! | Rounds: ${battle.round}`;
  }

  overlay.classList.add('active');
  updateWorldStats();
}

function closeResult() {
  document.getElementById('result-overlay').classList.remove('active');
  showScreen('world');
}

function addLog(msg, cls) {
  const el = document.getElementById('battle-log');
  const div = document.createElement('div');
  div.className = cls || '';
  div.textContent = msg;
  el.appendChild(div);
  el.scrollTop = el.scrollHeight;
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if (id === 'world') updateWorldStats();
}

function updateWorldStats() {
  document.getElementById('w-crystal').textContent = player.totalCards.length;
  document.getElementById('w-exp').textContent = player.exp;
  document.getElementById('w-wins').textContent = player.wins;
  document.getElementById('w-cards').textContent = player.totalCards.length;
}

// Build stage grid
function buildStageGrid() {
  const grid = document.getElementById('stage-grid');
  const stages = [
    {pid:1001, name:'Forest Path', diff:1},
    {pid:1001, name:'Forest Path', diff:2},
    {pid:1001, name:'Forest Path', diff:3},
    {pid:1002, name:'Dark Cave', diff:1},
    {pid:1002, name:'Dark Cave', diff:2},
    {pid:1002, name:'Dark Cave', diff:3},
    {pid:1003, name:'Fire Mountain', diff:1},
    {pid:1003, name:'Fire Mountain', diff:2},
    {pid:1003, name:'Fire Mountain', diff:3},
    {pid:1004, name:'Shadow Realm', diff:1},
    {pid:1004, name:'Shadow Realm', diff:2},
    {pid:1004, name:'Shadow Realm', diff:3},
  ];

  stages.forEach(s => {
    const card = document.createElement('div');
    card.className = 'stage-card';
    const diffStars = '*'.repeat(s.diff);
    const hpBonus = s.diff * 5;
    card.innerHTML = `
      <h3>${s.name}</h3>
      <div class="diff">Difficulty: ${diffStars} (${s.diff})</div>
      <div class="reward">Enemy HP: ${30 + hpBonus} | Reward: ${10 + s.diff*5} EXP</div>
    `;
    card.onclick = () => {
      battle = null;
      document.getElementById('battle-log').innerHTML = '';
      startBattle(s.pid, s.diff);
    };
    grid.appendChild(card);
  });
}

// Init
initPlayer();
buildStageGrid();
updateWorldStats();
</script>
